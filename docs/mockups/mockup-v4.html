<title>DuckbillRelic 목업</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Cinzel:wght@600&display=swap">
<style>
/* Layout: 위쪽 시연 막대(목업 전용) + 게임 안 플러그인 화면 재현. 인게임 ImGui 다크 화면이라 단일 다크 테마로 고정. */
:root {
  color-scheme: dark;
  --desk: #121419; --win: #1b1e25; --win-2: #22262f; --win-3: #2b303b;
  --line: #353b48; --line-soft: #2c313b; --col: rgba(125, 183, 216, .07);
  --fg: #e8e3d6; --muted: #959cab; --faint: #6b7282;
  --gold: #d8b25a; --gold-dim: #8a7240; --gold-ink: #241c08;
  --sky: #7db7d8; --ok: #7fc59a; --warn: #e0a057; --na: #14161b; --todo: #7a8294;
  --font-ui: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --font-mark: "Cinzel", "Times New Roman", serif;
  --cell: 26px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--desk); color: var(--fg); font-family: var(--font-ui); font-size: 13px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; }
.page { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--sky); outline-offset: 1px; }

/* ---------- 시연 막대 (목업 전용, 실제 화면 아님) ---------- */
.demo { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; color: var(--muted); font-size: 12px; }
.demo h1 { margin: 0; font-size: 17px; color: var(--fg); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: none; padding: 4px 12px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); font-weight: 600; }
.demo .hint { flex-basis: 100%; }

/* ---------- plugin window ---------- */
.win { background: var(--win); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.45); min-width: 0; position: relative; }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: linear-gradient(#2a2f3a, #232731); border-bottom: 1px solid var(--line); }
.titlebar .name { font-family: var(--font-mark); letter-spacing: .06em; color: var(--gold); font-size: 13px; }
.titlebar .ctl { margin-left: auto; color: var(--faint); font-family: var(--font-num); }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tab { color: var(--muted); background: transparent; border: 1px solid transparent; border-bottom: none; padding: 5px 14px; border-radius: 4px 4px 0 0; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); background: var(--win-3); border-color: var(--line); }
.topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; padding-bottom: 6px; }
select { font: inherit; font-size: 12px; color: var(--fg); background: var(--win); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }
.iconbtn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--win-2); color: var(--muted); cursor: pointer; font-weight: 600; }
.status { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 12px; background: var(--win-2); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); align-items: center; }
.status .s { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold-dim); flex: none; }
.dot.live { background: var(--ok); } .dot.no { background: transparent; border: 1px solid var(--warn); }
.toolbar { display: flex; gap: 14px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.toolbar input { accent-color: var(--gold); }
.banner { display: flex; gap: 8px; align-items: center; padding: 6px 12px; background: #1d2731; border-bottom: 1px solid #2f4252; font-size: 12px; }
.banner b { color: var(--sky); font-family: var(--font-num); }
.body { display: grid; grid-template-columns: minmax(0, max-content) minmax(320px, 1fr); min-height: 520px; }
.detail > * { max-width: 460px; }
@media (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } .detail { border-left: none; border-top: 1px solid var(--line); } }

/* ---------- matrix ---------- */
.matrixwrap { min-width: 0; display: flex; flex-direction: column; }
.scroller { overflow: auto; max-height: 600px; }
table.mx { border-collapse: separate; border-spacing: 0; font-size: 12px; }
.mx th, .mx td { padding: 0; }
.mx thead th { position: sticky; top: 0; background: var(--win); z-index: 2; font-weight: 500; height: 28px; border-bottom: 1px solid var(--line); }
.mx thead th.jobh { width: var(--cell); min-width: var(--cell); color: var(--muted); }
.mx thead th.jobh.on { color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold); }
.mx thead th.corner { left: 0; z-index: 3; min-width: 168px; }
.mx th.gstart, .mx td.gstart { border-left: 1px solid var(--line-soft); }
.mx td.colon { background: var(--col); }
.mx tbody th { position: sticky; left: 0; z-index: 1; background: var(--win); text-align: left; font-weight: 400; padding: 0 10px; white-space: nowrap; }
.mx tr.series th, .mx tr.series td { background: var(--win-3); height: 30px; border-top: 1px solid var(--line); }
.mx tr.series th { cursor: pointer; font-weight: 600; }
.mx tr.series th .tw { display: inline-block; width: 12px; color: var(--muted); font-weight: 400; }
.mx tr.series th .cnt { font: 400 11px var(--font-num); color: var(--muted); margin-left: 8px; }
.mx tr.series td { text-align: center; font: 11px var(--font-num); color: var(--muted); }
.mx tr.series td.full { color: var(--gold); } .mx tr.series td.unk { color: var(--sky); }
.mx tr.stage th { height: var(--cell); color: var(--fg); }
.mx tr.stage th .no { display: inline-block; width: 16px; color: var(--faint); font: 11px var(--font-num); }
.mx tr.stage th.sel { color: var(--gold); }
.mx tr.stage td { height: var(--cell); text-align: center; vertical-align: middle; }
.mx td.nacell { background: var(--na); }
.mx tr.stage:hover td:not(.colon):not(.nacell), .mx tr.stage:hover th { background: #20242c; }
.cellbtn { width: 22px; height: 20px; padding: 0; border: none; background: none; cursor: pointer; display: inline-grid; place-items: center; border-radius: 3px; }
.cellbtn.selected { box-shadow: 0 0 0 2px var(--sky); }
.g { width: 14px; height: 14px; display: block; flex: none; }
.g-done { position: relative; background: var(--gold); border-radius: 2px; }
.g-done.m::after { content: ''; position: absolute; right: -3px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 1.5px var(--win); }
.g-next { border: 2px solid var(--gold); border-radius: 2px; }
.g-todo { width: 6px; height: 6px; border-radius: 50%; background: var(--todo); margin: 4px; }
.g-unknown { color: var(--sky); font: 700 13px/14px var(--font-num); text-align: center; }
.g-na { background: var(--na); border: 1px solid var(--line); border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- detail ---------- */
.detail { border-left: 1px solid var(--line); background: var(--win-2); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; position: relative; }
.detail .job { color: var(--muted); font-size: 12px; }
.detail h2 { margin: 2px 0 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
.state { display: flex; gap: 8px; align-items: center; }
.state b { font-weight: 600; }
.state .why { color: var(--muted); font-size: 12px; }
.statebox { padding: 8px 10px; border-radius: 4px; background: var(--win); border: 1px solid var(--line); display: grid; gap: 2px; }
.sect { display: grid; gap: 6px; }
.sect h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.mt { width: 100%; border-collapse: collapse; font-size: 12px; }
.mt th { text-align: right; font-weight: 500; color: var(--faint); font-size: 11px; padding: 3px 4px; border-bottom: 1px solid var(--line); }
.mt th:first-child { text-align: left; }
.mt td { padding: 5px 4px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.mt tr.sub td { padding-top: 8px; color: var(--muted); font-size: 11px; border-bottom: none; }
.mt td.n { font-family: var(--font-num); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mt td.short { color: var(--gold); } .mt td.enough { color: var(--ok); }
.src { display: block; font-size: 10.5px; color: var(--faint); }
.src.warn { color: var(--warn); }
.mt input { width: 60px; font: inherit; font-family: var(--font-num); text-align: right; background: var(--win); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.bar { display: grid; gap: 4px; }
.barrow { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; }
.track { height: 6px; background: var(--win); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.track i { display: block; height: 100%; background: var(--gold); }
.barrow .v { font-family: var(--font-num); color: var(--muted); text-align: right; font-size: 11px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; position: relative; }
.btn { font-size: 12px; background: var(--win-3); border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.linkish { background: none; border: none; color: var(--muted); font-size: 11.5px; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.fixrow { display: flex; flex-wrap: wrap; gap: 4px 12px; width: 100%; }
.menu { position: absolute; bottom: calc(100% + 6px); right: 0; min-width: 200px; background: var(--win-3); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.45); padding: 4px; display: grid; z-index: 5; }
.menu button { text-align: left; background: none; border: none; padding: 6px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
.menu button:hover { background: var(--win-2); }
.menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 2px; }
.menu .lab { padding: 4px 10px 2px; font-size: 10.5px; color: var(--faint); letter-spacing: .04em; }
.help { position: absolute; top: 74px; right: 10px; width: min(340px, calc(100% - 20px)); background: var(--win-3); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.5); padding: 12px 14px; z-index: 6; display: grid; gap: 10px; font-size: 12px; }
.help h3 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.help .row { display: flex; align-items: center; gap: 8px; }
.help ul { margin: 0; padding-left: 16px; color: var(--muted); display: grid; gap: 2px; }

/* ---------- remaining ---------- */
.remain { padding: 14px; display: grid; gap: 14px; min-width: 0; }
.goals { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.goal { display: inline-flex; align-items: center; gap: 6px; background: var(--win-3); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px 2px 8px; font-size: 12px; }
.goal .left { color: var(--faint); font-size: 11px; } .goal .left.wait { color: var(--sky); }
.goal button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0 4px; }
.sums { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.sum { display: grid; gap: 0; }
.sum .k { color: var(--muted); font-size: 11px; }
.sum .v { font: 16px var(--font-num); font-variant-numeric: tabular-nums; }
.sum .v small { color: var(--muted); font-size: 11px; }
.sum .v.short { color: var(--warn); }
.tblwrap { overflow-x: auto; }
.rt { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 12.5px; }
.rt th { text-align: right; font-weight: 500; color: var(--faint); font-size: 11px; padding: 4px 8px; border-bottom: 1px solid var(--line); }
.rt th:first-child { text-align: left; }
.rt td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.rt td.n { font-family: var(--font-num); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rt tr.grp td { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; padding-top: 12px; }
.chip { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 10.5px; border: 1px solid var(--gold-dim); color: var(--gold); margin-left: 4px; }
@media (prefers-reduced-motion: no-preference) { .cellbtn { transition: box-shadow .12s; } }
</style>

        h += `<td class="${cc}${full ? ' full' : ''}${unk ? ' unk' : ''}">${unk ? '?' : full ? '완' : r || '–'}</td>`;
      });
      h += '</tr>';
      if (col) return;
      s.stages.forEach((stg, i) => {
        const k = i + 1; const selRow = ui.sel.s === s.id && ui.sel.k === k;
        h += `<tr class="stage"><th class="${selRow ? 'sel' : ''}"><span class="no">${k}</span>${stg.n}</th>`;
        jobs.forEach(o => {
          const kind = cellKind(s.id, o.a, k);
          const cls = (o.gstart ? 'gstart' : '') + (ui.sel.j === o.a ? ' colon' : '');
          if (kind === 'na') { h += `<td class="${cls} nacell"></td>`; return; }
          const ev = kind === 'done' ? evidence(s.id, o.a, k) : null;
          const sel = ui.sel.s === s.id && ui.sel.j === o.a && ui.sel.k === k;
          const tip = `${JOBNAME[o.a]} · ${titleOf(s, o.a, k)}&#10;${KIND[kind]}${ev ? ' · ' + EV[ev] : ''}`;
          h += `<td class="${cls}"><button type="button" class="cellbtn${sel ? ' selected' : ''}" data-s="${s.id}" data-j="${o.a}" data-k="${k}" aria-label="${JOBNAME[o.a]} ${k}단계: ${KIND[kind]}" title="${tip}">${glyph(kind, ev)}</button></td>`;
        });
        h += '</tr>';
      });
    });
    const mx = document.getElementById('mx'); mx.innerHTML = h + '</tbody>';
    mx.querySelectorAll('.cellbtn').forEach(b => b.onclick = () => { ui.sel = {s:b.dataset.s, j:b.dataset.j, k:+b.dataset.k}; ui.menu = false; ui.fixOpen = false; renderMatrix(); renderDetail(); });
    mx.querySelectorAll('tr.series th').forEach(th => {
      const t = () => { ui.collapsed[th.dataset.series] = !ui.collapsed[th.dataset.series]; renderMatrix(); };
      th.onclick = t; th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t(); } };
    });
    document.getElementById('legend').innerHTML = V === 'mid' ? `<div class="legend"><span>${glyph('done')}완료</span><span>${glyph('next')}다음 단계</span><span>${glyph('todo')}미완료</span><span>${glyph('unknown')}확인 전</span><span><span class="g g-na"></span>해당 없음</span><span><span class="g g-done m"></span>직접 표시</span></div>` : '';
  }

  // ---------- detail ----------
  const fmt = n => n == null ? '—' : n.toLocaleString('ko-KR');
  const ownOf = id => ui.override[id] != null ? ui.override[id] : M[id].own;
  function reason(kind, ev, s, j, k) {
    const p = prog(s.id, j);
    if (kind === 'done') return EV[ev];
    if (kind === 'unknown') return '업적 화면을 한 번 열면 확인됩니다.';
    if (kind === 'next') return p.cap != null ? '판정을 직접 낮춘 상태입니다.' : '';
    return p.cap != null && k > p.cap ? '판정을 직접 낮춘 상태입니다.' : '';
  }
  function matRow(id, per, isOnce, onceOk) {
    const m = M[id]; const own = ownOf(id);
    const srcMid = V === 'mid';
    if (skipSum(m)) return `<tr><td>${m.n}<span class="src">${WHERE[m.w]}</span></td><td class="n">${fmt(per)}</td><td class="n">—</td></tr>`;
    if (isOnce && onceOk) return `<tr><td>${m.n}${srcMid ? '<span class="src">해금 퀘스트 완료</span>' : ''}</td><td class="n">${fmt(per)}</td><td class="n enough">완료</td></tr>`;
    const ownCell = manualW(m) ? `<input id="ov-${id}" type="number" min="0" inputmode="numeric" value="${own ?? ''}" placeholder="입력" aria-label="${m.n} 직접 입력">` : fmt(own);
    const enough = own != null && own >= per;
    let src = '';
    if (manualW(m)) src = `<span class="src warn">${WHERE[m.w]}</span>`;
    else if (srcMid) src = (m.w ? `<span class="src">${WHERE[m.w]}</span>` : '') + (m.cur ? `<span class="src">${m.cur} ${fmt(m.c)} / 개</span>` : '');
    const tip = !srcMid && (m.w || m.cur) ? ` title="${[m.w ? WHERE[m.w] : '', m.cur ? m.cur + ' ' + fmt(m.c) + ' / 개' : ''].filter(Boolean).join(' · ')}"` : '';
    return `<tr${tip}><td>${m.n}${src}</td><td class="n">${fmt(per)}</td><td class="n ${own == null ? '' : enough ? 'enough' : 'short'}">${ownCell}</td></tr>`;
  }
  function renderDetail() {
    const {s:sid, j, k} = ui.sel; const s = S[sid]; const stg = s.stages[k-1];
    if (!stg || !has(sid, j)) return;
    const kind = cellKind(sid, j, k); const ev = kind === 'done' ? evidence(sid, j, k) : null;
    const p = prog(sid, j);
    const rn = relicName(s, j, k);
    let h = `<div><div class="job">${JOBNAME[j]} · ${s.name} ${k}단계</div><h2>${titleOf(s, j, k)}</h2>${rn ? '' : '<div class="job">실제 화면에서는 이 직업의 레릭 이름이 나옵니다</div>'}</div>`;
    const why = reason(kind, ev, s, j, k);
    h += V === 'mid'
      ? `<div class="statebox"><div class="state">${glyph(kind, ev)}<b>${KIND[kind]}</b></div>${why ? `<span class="state why">${kind === 'done' ? '근거: ' : ''}${why}</span>` : ''}</div>`
      : `<div class="state">${glyph(kind, ev)}<b>${KIND[kind]}</b>${why ? `<span class="why">· ${why}</span>` : ''}</div>`;
    if (kind === 'next' && questActive[sid+'|'+k]) h += `<p class="note">단계 퀘스트: ${questActive[sid+'|'+k]}</p>`;
    if (V === 'mid' && stg.relicnote && (kind === 'next' || kind === 'todo')) {
      const rows = [['몬스터',6,10],['던전',2,3],['돌발',1,3],['리브',3,3]];
      h += `<div class="sect"><h3>황도 12문서 · 현재 권</h3><div class="bar">` + rows.map(([n,v,m]) => `<div class="barrow"><span>${n}</span><span class="track"><i style="width:${v/m*100}%"></i></span><span class="v">${v}/${m}</span></div>`).join('') + '</div></div>';
    }
    if (s.cosmic) h += '<p class="note">세부 버전과 연구 데이터는 게임의 우주 연구 화면에서 확인하세요.</p>';
    else if (stg.mats && stg.mats.length && kind !== 'done') {
      const per = stg.mats.filter(m => !m[2]); const on = stg.mats.filter(m => m[2]); const onceOk = !!onceDone[sid+'|'+k];
      h += '<div class="sect"><h3>필요 재료</h3><table class="mt"><thead><tr><th>아이템</th><th>필요</th><th>보유</th></tr></thead><tbody>';
      if (on.length) {
        h += `<tr class="sub"><td colspan="3">캐릭터당 1회</td></tr>`;
        on.forEach(([id, n]) => h += matRow(id, n, true, onceOk));
        if (stg.more && V === 'mid') h += `<tr><td colspan="3" class="note">외 ${stg.more}</td></tr>`;
        if (per.length) h += `<tr class="sub"><td colspan="3">무기마다</td></tr>`;
      }
      per.forEach(([id, n]) => h += matRow(id, n, false));
      h += '</tbody></table>';
      if (stg.firstFree && V === 'mid') h += '<p class="note">첫 무기는 퀘스트로 무료입니다. 이 캐릭터는 이미 받았습니다.</p>';
      h += '</div>';
    } else if (stg.note && kind !== 'done') h += `<p class="note">${stg.note}</p>`;

    const isGoal = ui.goals.some(g => g.s === sid && g.j === j);
    const full = reached(sid, j) >= s.stages.length;
    const fixes = [];
    if (kind === 'done' && ev === 'manual') fixes.push(['manualOff', '여기부터 직접 표시 해제']);
    if (kind === 'done' && ev !== 'manual') fixes.push(['capDown', '여기부터 미완료로 고치기']);
    if (kind === 'done' && (ev === 'item' || ev === 'cache') && p.it && k === p.it[0]) fixes.push(['clearObs', '이 확인 기록 지우기']);
    if (p.cap != null) fixes.push(['capUndo', '고친 판정 되돌리기']);
    const manualOn = kind !== 'done' ? ['manualOn', '여기까지 완료로 표시'] : null;
    h += '<div class="actions">';
    h += `<button type="button" class="btn primary" id="addGoal" ${isGoal || full ? 'disabled' : ''}>${isGoal ? '목표에 있음' : '목표에 추가'}</button>`;
    if (V === 'min') {
      h += `<button type="button" class="btn" id="moreBtn" aria-haspopup="menu" aria-expanded="${ui.menu}" aria-label="더 보기">⋯</button>`;
      if (ui.menu) {
        h += '<div class="menu" role="menu">';
        if (manualOn) h += `<button type="button" role="menuitem" data-act="${manualOn[0]}">${manualOn[1]}</button>`;
        h += '<button type="button" role="menuitem" data-act="map">교환 NPC 지도에 표시</button>';
        if (fixes.length) { h += '<hr><div class="lab">판정이 틀렸다면</div>'; fixes.forEach(([a, t]) => h += `<button type="button" role="menuitem" data-act="${a}">${t}</button>`); }
        h += '</div>';
      }
    } else {
      if (manualOn) h += `<button type="button" class="btn" data-act="${manualOn[0]}">${manualOn[1]}</button>`;
      h += '<button type="button" class="btn" data-act="map">교환 NPC 지도</button>';
      if (fixes.length) {
        h += `<div class="fixrow"><button type="button" class="linkish" id="fixToggle" aria-expanded="${ui.fixOpen}">판정이 틀렸다면 ${ui.fixOpen ? '▴' : '▾'}</button>`;
        if (ui.fixOpen) fixes.forEach(([a, t]) => h += `<button type="button" class="linkish" data-act="${a}">${t}</button>`);
        h += '</div>';
      }
    }
    h += '</div>';
    const d = document.getElementById('detail'); d.innerHTML = h;
    const rerender = () => { ui.menu = false; renderMatrix(); renderDetail(); };
    d.querySelectorAll('input[id^="ov-"]').forEach(inp => inp.onchange = () => { ui.override[inp.id.slice(3)] = inp.value === '' ? null : Math.max(0, parseInt(inp.value, 10) || 0); renderDetail(); });
    d.querySelector('#addGoal').onclick = () => { ui.goals.push({s:sid, j, to:s.stages.length}); renderDetail(); };
    const mb = d.querySelector('#moreBtn'); if (mb) mb.onclick = () => { ui.menu = !ui.menu; renderDetail(); };
    const ft = d.querySelector('#fixToggle'); if (ft) ft.onclick = () => { ui.fixOpen = !ui.fixOpen; renderDetail(); };
    const acts = {
      manualOn: () => { p.man = k; if (p.cap != null && p.cap < k) p.cap = null; },
      manualOff: () => { p.man = k - 1; }, capDown: () => { p.cap = k - 1; }, clearObs: () => { p.it = null; }, capUndo: () => { p.cap = null; },
      map: () => {},
    };
    d.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { acts[b.dataset.act](); rerender(); });
  }

  // ---------- remaining ----------
  function renderRemain() {
    const need = {}; const labels = []; const onceSeen = new Set(); let waiting = 0, guide = new Set();
    ui.goals.forEach((g, gi) => {
      const s = S[g.s]; const r = reached(g.s, g.j); const unk = unknownTop(g.s, g.j) > 0;
      const label = `${JOBNAME[g.j]} · ${s.name}`;
      if (unk) { waiting++; labels.push({label, gi, left:'업적 확인 전', wait:true}); return; }
      labels.push({label, gi, left: g.to > r ? `${g.to - r}단계 남음` : '완료'});
      for (let k = r + 1; k <= g.to; k++) (s.stages[k-1].mats || []).forEach(([id, per, isOnce]) => {
        const m = M[id]; if (m.w === 'chain') return; if (m.w === 'guide') { guide.add(id); return; }
        if (isOnce) { if (onceDone[g.s+'|'+k] || onceSeen.has(g.s+'|'+k+'|'+id)) return; onceSeen.add(g.s+'|'+k+'|'+id); }
        need[id] = need[id] || {total:0, once:false, uses:new Set()}; need[id].total += per; need[id].once ||= !!isOnce; need[id].uses.add(`${JOBNAME[g.j]} ${s.name}`);
      });
    });
    const rows = Object.entries(need).map(([id, o]) => { const m = M[id]; const own = ownOf(id); return {id, m, total:o.total, own, once:o.once, uses:[...o.uses], left: own == null ? null : Math.max(o.total - own, 0)}; });
    const curNeed = {}; rows.forEach(r => { if (r.m.cur && r.left) curNeed[r.m.cur] = (curNeed[r.m.cur] || 0) + r.left * r.m.c; });
    let h = `<div class="goals">${labels.map(g => `<span class="goal">${g.label}<span class="left${g.wait ? ' wait' : ''}">${g.left}</span><button type="button" data-gi="${g.gi}" aria-label="${g.label} 목표 삭제">✕</button></span>`).join('')}</div>`;
    h += '<div class="sums">' + Object.entries(curNeed).map(([cur, v]) => {
      const k = cur === '길' || cur === '스크립' ? cur : '알라그 석판: ' + cur;
      return `<div class="sum"><span class="k">${k}</span><span class="v${v > CURRENCY[cur] ? ' short' : ''}">${fmt(v)} <small>/ 보유 ${fmt(CURRENCY[cur])}</small></span></div>`;
    }).join('') + '</div>';
    if (waiting || guide.size) h += `<p class="note">합계에서 빠진 것: ${[waiting ? `업적 확인 전 목표 ${waiting}개` : '', guide.size ? `게임에서만 확인하는 진행 ${guide.size}종` : ''].filter(Boolean).join(', ')}</p>`;
    const TOMES = ['시학','수리'];
    const groups = V === 'mid'
      ? [['석판으로 교환', r => TOMES.includes(r.m.cur)], ['길·스크립으로 구매', r => r.m.cur && !TOMES.includes(r.m.cur)], ['콘텐츠 보상·기타', r => !r.m.cur && !manualW(r.m)], ['직접 입력', r => manualW(r.m)]]
      : [['', () => true]];
    h += '<div class="tblwrap"><table class="rt"><thead><tr><th>아이템</th><th>필요</th><th>보유</th><th>남음</th></tr></thead><tbody>';
    groups.forEach(([label, f]) => {
      let rs = rows.filter(f); if (!rs.length) return;
      if (V === 'min') rs = rs.sort((a, b) => (b.left ?? 1e9) - (a.left ?? 1e9) || 0);
      if (label) h += `<tr class="grp"><td colspan="4">${label}</td></tr>`;
      rs.forEach(r => {
        const tip = ` title="${r.uses.join(', ')}${r.m.cur ? ' · ' + r.m.cur + ' ' + fmt(r.m.c) + ' / 개' : ''}"`;
        h += `<tr${tip}><td>${r.m.n}${r.once ? '<span class="chip">1회</span>' : ''}${V === 'mid' ? `<span class="src">${r.uses.join(', ')}</span>` : ''}</td><td class="n">${fmt(r.total)}</td><td class="n">${fmt(r.own)}</td><td class="n" style="color:${r.left ? 'var(--gold)' : 'var(--ok)'}">${r.left == null ? '입력 필요' : fmt(r.left)}</td></tr>`;
      });
    });
    h += '</tbody></table></div>';
    const el = document.getElementById('bodyRemain'); el.innerHTML = h;
    el.querySelectorAll('button[data-gi]').forEach(b => b.onclick = () => { ui.goals.splice(+b.dataset.gi, 1); renderRemain(); });
  }

  // ---------- demo controls ----------
  function renderDemo() {
    document.querySelectorAll('#segVar button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.v === V); b.onclick = () => { V = b.dataset.v; ui.menu = false; ui.help = false; try { history.replaceState(null, '', '#' + V); } catch (e) {} renderAll(); }; });
    document.querySelectorAll('#segAch button').forEach(b => { b.setAttribute('aria-pressed', (b.dataset.a === '1') === ui.achLoaded); b.onclick = () => { ui.achLoaded = b.dataset.a === '1'; renderAll(); }; });
  }
  function renderAll() {
    if (ui.tab !== 'remain' && S[ui.sel.s].tab !== ui.tab) ui.sel = Object.assign({}, defaultSel[ui.tab]);
    renderDemo(); renderTop(); renderHelp();
    if (ui.tab === 'remain') renderRemain(); else { renderMatrix(); renderDetail(); }
  }
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'min' || h === 'mid') { V = h; renderAll(); } });
  renderAll();
})();
</script>
